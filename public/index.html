<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SillyScoreReview</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-title">
    <h1>SillyScoreReview</h1>
    <span id="dirLabel" class="dir-label"></span>
  </div>
  <div class="topbar-stats" id="stats"></div>
</header>

<div class="toolbar">
  <input id="search" type="search" placeholder="Search name…" />
  <select id="sortBy">
    <option value="score-asc">Score: low → high</option>
    <option value="score-desc">Score: high → low</option>
    <option value="tokens-desc">Tokens: high → low</option>
    <option value="tokens-asc">Tokens: low → high</option>
    <option value="name">Name A → Z</option>
  </select>
  <select id="filterBy">
    <option value="all">All cards</option>
    <option value="unscored">Unscored / errored only</option>
    <option value="below4">Score below 4</option>
    <option value="below6">Score below 6</option>
    <option value="scored">Scored only</option>
  </select>
  <button id="scanUnscoredBtn">Scan unscored</button>
  <button id="rescanAllBtn" class="secondary">Rescore all</button>
  <button id="folderBtn" class="secondary">Change folder</button>
  <button id="trashToggleBtn" class="secondary">Trash</button>
</div>

<div id="progressBar" class="progress hidden">
  <div class="progress-fill" id="progressFill"></div>
  <span id="progressLabel"></span>
</div>

<div id="selectionBar" class="selection-bar hidden">
  <span id="selectionCount"></span>
  <button id="scoreSelectedBtn">Score selected</button>
  <button id="deleteSelectedBtn" class="danger">Delete selected</button>
  <button id="clearSelectionBtn" class="secondary">Clear</button>
</div>

<main id="grid" class="grid"></main>
<div id="emptyState" class="empty-state hidden">No cards found in the characters directory.</div>

<aside id="trashPanel" class="trash-panel hidden">
  <div class="trash-header">
    <h2>Trash</h2>
    <div>
      <button id="emptyTrashBtn" class="danger">Empty trash</button>
      <button id="closeTrashBtn" class="secondary">Close</button>
    </div>
  </div>
  <ul id="trashList"></ul>
</aside>

<aside id="folderPanel" class="trash-panel hidden">
  <div class="trash-header">
    <h2>Choose characters folder</h2>
    <button id="closeFolderBtn" class="secondary">Close</button>
  </div>
  <p class="folder-hint">Browse to the folder holding your SillyTavern card PNGs/JSON (e.g. <code>SillyTavern/data/default-user/characters</code>), or paste the full path directly.</p>
  <div class="folder-path-row">
    <input id="folderPathInput" type="text" placeholder="/path/to/characters" />
    <button id="folderGoBtn">Go</button>
  </div>
  <div class="folder-path-row">
    <button id="folderHomeBtn" class="secondary">Home</button>
    <button id="folderUpBtn" class="secondary">Up one level</button>
  </div>
  <div id="folderInfo" class="folder-info"></div>
  <ul id="folderList"></ul>
  <div class="folder-actions">
    <button id="useFolderBtn">Use this folder</button>
  </div>
</aside>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal">
    <button id="modalClose" class="modal-close">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
